name: Release Windows

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - deploy/pyinstaller/**
      - services/sidecar/**
      - apps/desktop/src-tauri/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Empaquetar el backend como sidecar
        shell: bash
        run: |
          uv sync --all-packages --locked --no-dev
          uv run --no-dev --with pyinstaller pyinstaller --noconfirm --onefile --name cip-backend \
            --additional-hooks-dir deploy/pyinstaller services/sidecar/src/cip_sidecar/main.py
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist/cip-backend.exe apps/desktop/src-tauri/binaries/cip-backend-x86_64-pc-windows-msvc.exe
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Construir instaladores NSIS y MSI
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: asistente-cip-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
