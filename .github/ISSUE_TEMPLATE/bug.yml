name: Error
description: Reportar un comportamiento incorrecto
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      value: "1. "
  - type: input
    id: version
    attributes:
      label: Versión de la app
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que no adjunto PDFs ni textos confidenciales
          required: true
