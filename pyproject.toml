[project]
name = "cip-research-assistant"
version = "0.1.0"
description = "Asistente de investigación con IA para científicos del CIP"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "cip-testkit",
]

[tool.uv.sources]
cip-testkit = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["packages", "services"]
