[project]
name = "cip-evals"
version = "0.1.0"
description = "Evaluación reproducible de recuperación, verificación de citas y borradores"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cip-contracts",
    "cip-library",
    "cip-agents",
    "cip-testkit",
    "httpx>=0.28",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tabulate>=0.9",
]

[project.scripts]
cip-eval = "cip_evals.run:main"

[tool.uv.sources]
cip-contracts = { workspace = true }
cip-library = { workspace = true }
cip-agents = { workspace = true }
cip-testkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
