[project]
name = "cip-library"
version = "0.1.0"
description = "Ingesta de PDFs y recuperación híbrida con metadatos de cita"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cip-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "numpy>=2.1",
    "pypdf>=5.1",
    "pydantic-settings>=2.6",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.5"]

[tool.uv.sources]
cip-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
