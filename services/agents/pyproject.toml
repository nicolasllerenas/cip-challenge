[project]
name = "cip-agents"
version = "0.1.0"
description = "Orquestación multiagente con LangGraph para redactar estados del arte con citas verificadas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cip-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "anthropic>=1.0",
    "langgraph>=1.1",
    "pydantic-settings>=2.6",
]

[project.scripts]
cip-check-ai = "cip_agents.check:main"

[tool.uv.sources]
cip-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
