[project]
name = "cip-gateway"
version = "0.1.0"
description = "BFF de la app de escritorio: REST para comandos y SSE para resultados en tiempo real"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cip-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
cip-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
